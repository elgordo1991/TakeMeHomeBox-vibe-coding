<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FAF6F0" />
  <title>Offline · TakeMeHomeBox</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #FAF6F0; color: #2B211C; font-family: Nunito, system-ui, -apple-system, sans-serif; padding: 24px; box-sizing: border-box; }
    .card { background: #fff; border: 1px solid #EBE2D6; border-radius: 24px; padding: 32px; max-width: 340px; text-align: center;
            box-shadow: 0 4px 16px rgba(43,33,28,.06); }
    img { width: 88px; height: 88px; border-radius: 22px; }
    h1 { font-size: 24px; margin: 16px 0 8px; }
    p { color: #6B5D53; margin: 0 0 20px; line-height: 1.5; }
    button { background: #F26B3A; color: #fff; border: 0; border-radius: 999px; padding: 14px 24px; font: inherit; font-weight: 700; width: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>TakeMeHomeBox needs a connection to show boxes near you. Check your signal and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
